<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>servidor operativo</title>
<style>
body{background:#0d1117;color:#c9d1d9;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;text-align:center}
.box{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:40px;max-width:500px}
h1{color:#3fb950;font-size:20px;margin:0 0 10px}
.ip{color:#58a6ff;font-size:14px;margin:8px 0}
a{color:#58a6ff;text-decoration:none}
a:hover{text-decoration:underline}
.links{margin-top:20px;font-size:13px}
.footer{margin-top:30px;font-size:11px;color:#30363d}
</style>
</head>
<body>
<div class="box">
  <h1>&#x2705; servidor operativo</h1>
  <p style="font-size:13px;color:#8b949e">Raspberry Pi 4 · 2GB RAM</p>
  <div class="ip" id="ip">cargando...</div>
  <div class="links">
    <a href="/panel/">· panel de control ·</a><br>
    <small style="color:#484f58">admin / contraseña en creds.env</small>
  </div>
  <div class="links" style="margin-top:16px">
    <p style="font-size:12px;color:#8b949e">añadir sitio:</p>
    <code style="background:#0d1117;padding:4px 8px;border-radius:4px;font-size:11px">ssh webadmin@ip<br>bash add-site.sh</code>
  </div>
  <div class="footer">kzltc · github.com/kzltc</div>
</div>
<script>
// muestra la ip desde la que se esta viendo
document.getElementById("ip").textContent = window.location.hostname;
</script>
</body>
</html>
